<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'self'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Desktop Pet</title>
</head>
<body>
  <button id="pet" type="button" aria-label="DeepSeek 桌宠，可拖动">
    <span id="stage" aria-hidden="true"><span id="sprite"></span></span>
    <span id="status" role="status"></span>
    <span id="activity-controls" aria-hidden="true">
      <span id="activity-pulse"><span></span><span></span><span></span></span>
      <span id="activity-toggle"></span>
    </span>
    <span id="activity-card" title="点击返回当前任务">
      <span id="activity-context"></span>
      <span id="activity-label"></span>
    </span>
  </button>
  <script src="./pet-renderer.js"></script>
</body>
</html>
